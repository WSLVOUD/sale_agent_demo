name: Regression Tests (手动触发)

# 客户要求：取消 GitHub 的自动 CI 检测 —— 不再在 push / pull_request 时自动运行。
# 需要跑的时候，在仓库 Actions 页面手动点 “Run workflow”。
# 若要彻底删除，直接删掉本文件即可。
on:
  workflow_dispatch:

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  # ── 基础检查 ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -q ruff mypy
          echo "Checking imports..."
          python -c "import src; print('Import OK')" || exit 1

      - name: Ruff lint
        run: |
          ruff check src/rag/ src/core/ src/models/ eval/ --ignore E501,F401

      - name: Syntax check
        run: |
          python -m py_compile src/api.py src/config.py
          python -m py_compile src/rag/router.py src/rag/fast_path.py
          python -m py_compile src/rag/json_loader.py
          python -m py_compile src/agents/solution/runner.py
          python -m py_compile src/agents/solution/nodes/reflection.py
          python -m py_compile eval/metrics.py eval/retrieval_eval.py eval/recommendation_eval.py
          python -m py_compile eval/calculator_eval.py eval/dialogue/run_dialogue_eval.py
          echo "All syntax checks passed"

  # ── 核心模块单元测试 ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest pytest-asyncio httpx

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -x

  # ── 评测基线（离线可跑的两条评测）──────────────────────────────────────
  eval-baseline:
    name: Eval Baseline (Calculator + Recommendation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Calculator accuracy (14 cases, must be 100%)
        run: |
          python -m eval.calculator_eval | tee /tmp/calc.log
          grep -q "Calculator Accuracy: 1.0" /tmp/calc.log

      - name: Requirement / routing / recommendation baseline
        run: python -m eval.recommendation_eval

  # ── 同步 API 健康检查 ────────────────────────────────────────────────────
  api-smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt fastapi[standard] httpx

      - name: Start API
        run: |
          nohup python -m uvicorn src.api:app --host 127.0.0.1 --port 8765 > api.log 2>&1 &
          sleep 5
          curl -s http://127.0.0.1:8765/health | python -c "import sys,json; d=json.load(sys.stdin); print(f'Status: {d[\"status\"]}, Records: {d[\"record_count\"]}')"

      - name: POST /chat smoke test
        run: |
          curl -s -X POST http://127.0.0.1:8765/chat \
            -H "Content-Type: application/json" \
            -d '{"session_id":"ci-test","question":"会议室用什么屏好"}' \
          | python -c "import sys,json; d=json.load(sys.stdin); print(f'Answer length: {len(d[\"answer\"])} chars, Route: {d.get(\"route\",\"n/a\")}')"
