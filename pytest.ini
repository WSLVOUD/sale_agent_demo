[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# ── 全量测试瘦身（客户口径 2026-09-22）────────────────────────────────────
# 只有一棵树：tests/，全量约 590 条、约 1.5 分钟。
#     pytest -q            # 全量（也是唯一入口）
#     pytest tests/test_vision_pipeline.py -q   # 单跑某个文件
# 之前拆出去的扩展语料（需求抽取语料 / RAG 检索 / 推荐引擎 / 工程计算 /
# 措辞大全）已按客户口径精简掉 —— 需要时从 git 历史取回，见 README「测试」一节。
markers =
    slow: 旧版"扩展语料"标记（已并入 tests/；保留注册避免告警）
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning
