<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED产品助手</title>
    <!-- ?v= 用于强制刷新静态资源缓存（改前端后不用手动清缓存） -->
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <div class="chat-container">
        <!-- 顶部导航栏 -->
        <header class="chat-header">
            <div class="header-left">
                <span class="status-indicator" id="status-indicator"></span>
            </div>
            <h1 class="header-title">LED产品助手</h1>
            <div class="header-right">
                <button class="new-chat-btn" id="new-chat-btn" title="新对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 消息区域 -->
        <main class="messages-area" id="messages-area">
            <!-- 欢迎界面 -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">💡</div>
                <h2 class="welcome-title">LED产品选型助手</h2>
                <p class="welcome-subtitle">请用英文描述您的需求</p>
                <div class="quick-questions">
                    <button class="quick-question-btn" data-question="Indoor display for conference room, 4 meters viewing distance">
                        <span class="quick-icon">🏢</span>
                        <span class="quick-text">会议室显示屏</span>
                    </button>
                    <button class="quick-question-btn" data-question="Virtual production LED screen, need HDR support">
                        <span class="quick-icon">🎬</span>
                        <span class="quick-text">虚拟制作屏幕</span>
                    </button>
                    <button class="quick-question-btn" data-question="Outdoor rental screen, 5m viewing distance, IP65">
                        <span class="quick-icon">🌤️</span>
                        <span class="quick-text">户外租赁屏</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- 底部输入区 -->
        <footer class="input-area">
            <!-- 待发送的图片预览（客户发照片时用） -->
            <div class="image-preview" id="image-preview"></div>
            <div class="input-wrapper">
                <button class="attach-btn" id="attach-btn" type="button" title="添加图片（也可以直接粘贴或拖拽）">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                    </svg>
                    <span class="attach-text">图片</span>
                </button>
                <input type="file" id="image-input" accept="image/*" multiple hidden>
                <textarea 
                    class="message-input" 
                    id="message-input" 
                    placeholder="请输入您的问题，或粘贴/上传一张图片..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="send-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">可点"+ 图片"上传，或直接粘贴（Ctrl+V）/ 拖拽图片，最多 3 张</div>
        </footer>
    </div>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
